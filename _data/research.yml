- name: "Cybersecurity & AI-based Threat Detection"
  description: >-
    Security and privacy for wireless and distributed systems and AI-driven
    defense: authentication, signcryption and attribute-based access control;
    trust and intrusion detection for VANETs and fog computing; and machine-learning
    detection of cyber attacks, including DDoS mitigation in software-defined
    networks (P4), ransomware detection, and uncertainty quantification of security
    models.
  related_publications: "See Publications (security, signcryption, access control)"
  related_projects: "DDoS mitigation in SDN (FRIDA); DDoS stacking-ensemble detection (FRIDA); uncertainty quantification of AI security models (FRIDA-7463)"
