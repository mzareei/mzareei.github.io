- name: "Cybersecurity & AI-based Threat Detection"
  description: "Security and privacy for wireless and distributed systems, including authentication, access control, trust, intrusion detection, and machine-learning defenses against cyber attacks."
  related_projects: "DDoS mitigation in SDN; uncertainty quantification for AI security models"
  collaborators: "C. Vargas-Rosales; A. Waheed; S. A. Soleymani"
- name: "Applied Machine Learning"
  description: "Machine and deep learning applied to biomedical signals, image segmentation, demand forecasting, road-anomaly detection, and community detection in complex networks."
- name: "Natural Language Processing"
  description: "Sentiment and emotion analysis, multilingual language modeling, machine translation, and large-scale social-media analytics."
  collaborators: "L. I. Barbosa-Santillán; L. E. Falcón Morales"
- name: "AI for Mental Health & Social Good"
  description: "Responsible AI for health and societal benefit, including detecting signals of depression and suicide risk in privacy-sensitive contexts."
  related_projects: "AI model for suicide-risk behavioral patterns"
- name: "Wireless Sensor & Cognitive Radio Networks"
  description: "Mobility-aware MAC protocols, cognitive radio networks, routing architectures, and energy-harvesting sensor networks for environmental monitoring."
  related_projects: "Energy-Harvesting Sensor Networks for Environmental Monitoring"
  collaborators: "C. Vargas-Rosales; R. Villalpando-Hernández"
- name: "Internet of Things & Vehicular Networks"
  description: "Secure and software-defined architectures for vehicular networks, IoT communication and caching, underwater acoustic networks, and energy-efficient protocols."
