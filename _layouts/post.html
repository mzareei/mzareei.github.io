---
layout: default
---
<article class="container page post">
  <p class="breadcrumb"><a href="{{ '/blog/' | relative_url }}">← All notes</a></p>
  <header class="site-masthead site-masthead--reading">
    <p class="eyebrow">Academic notes</p>
    <h1 class="site-masthead__title">{{ page.title }}</h1>
    <p class="post__meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}
    </p>
  </header>
  <div class="post__content reading-column">{{ content }}</div>
</article>
