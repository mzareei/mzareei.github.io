# ============================================================
#  SITE CONFIGURATION
#  Edit the values in this file to update site-wide settings.
#  After editing _config.yml you must restart `jekyll serve`
#  (changes here are NOT picked up by live-reload).
# ============================================================

# ---- Identity ----
name: "Mahdi Zareei"
title: "Research Professor"
affiliation: "School of Engineering and Sciences, Tecnológico de Monterrey, Mexico"
affiliation_url: "https://tec.mx/en"
tagline: "Information security · Applied machine learning · NLP"
short_summary: >-
  Research Professor at the School of Engineering and Sciences, Tecnológico de
  Monterrey, Mexico. My research focuses on information security, applied machine
  learning, and natural language processing. I am an IEEE Senior Member and a member
  of Mexico's National System of Researchers (SNI, Level I).

email: "m.zareei@ieee.org"                # also reachable at m.zareei@tec.mx

# ---- SEO / metadata ----
description: >-
  Academic homepage of Mahdi Zareei, Research Professor at the School of
  Engineering and Sciences, Tecnológico de Monterrey. Research in information
  security, applied machine learning, natural language processing, wireless
  networks, and the Internet of Things. CV, publications, and teaching.
keywords: >-
  Mahdi Zareei, Tecnológico de Monterrey, information security, applied machine
  learning, natural language processing, wireless sensor networks, cognitive radio,
  Internet of Things, VANET, network security, research professor, IEEE Senior Member
lang: en

# ---- URLs ----
# For a GitHub user/organization page (username.github.io) leave baseurl empty.
# For a project page (username.github.io/repo) set baseurl: "/repo".
url: "https://mzareei.github.io"
baseurl: ""

# ---- Academic profile links (TODO: replace with your real URLs) ----
# Leave a value blank ("") to hide that icon/link.
profiles:
  cv: ""                                    # set to "/assets/cv/cv.pdf" after adding the PDF to assets/cv/
  google_scholar: "https://scholar.google.com/citations?user=IhVgxzAAAAAJ"
  orcid: "https://orcid.org/0000-0001-6623-1758"
  scopus: "https://www.scopus.com/authid/detail.uri?authorId=48762315500"
  github: "https://github.com/mzareei"      # TODO: confirm this is your GitHub
  linkedin: "https://www.linkedin.com/in/mzareei"
  dblp: ""                                  # optional
  researchgate: "https://www.researchgate.net/profile/Mahdi_Zareei"

# ---- Build settings ----
markdown: kramdown
permalink: pretty
timezone: Etc/UTC

# Collections: each course lives as its own file in _courses/
collections:
  courses:
    output: true
    permalink: /teaching/:name/

# Default front-matter so pages do not need to repeat `layout`
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: courses
    values:
      layout: course
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Files/folders Jekyll should ignore
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - LICENSE

# Plugins (all supported on GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
